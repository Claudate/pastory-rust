name: MAS build (manual)

# Sandbox + store variant (docs/MAS_PLAN.md §3): builds the `mas` feature app
# and uploads it as an artifact. GitHub runners carry no Apple Distribution
# certificate or provisioning profile, so this is always an ad-hoc-signed,
# upload-rejectable smoke build — the real signing + pkg + Transporter upload
# runs `./build-mas.sh` locally (header of that script lists what it needs).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mas:
    name: macOS universal (mas feature, ad-hoc)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build sandboxed bundle
        run: ARCHS="aarch64 x86_64" ./build-mas.sh

      - name: Upload the app (smoke only — not store-uploadable)
        uses: actions/upload-artifact@v4
        with:
          name: PasteJar-app
          path: build/PasteJar.app

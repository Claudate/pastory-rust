[package]
name = "pastory"
version = "1.0.7"
edition = "2021"

[dependencies]
objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
rusqlite = "0.40.2"
objc2-image-io = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-vision = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video", "block2"] }
objc2-core-video = "0.3.2"
objc2-core-media = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-image = "0.3.2"
gif = "0.14.2"

[profile.release]
opt-level = 3
